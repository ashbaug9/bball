<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7th Grade Practice</title>
<meta name="theme-color" content="#12233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Practice">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#12233F; --ink2:#4A5A73; --line:#D5DBE3;
  --amber:#FFB81C; --amber-ink:#3A2A00; --full:#2E7D32; --half:#D35400; --focus:#1565C0;
  --chip:#E4E9F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#17223A; --ink:#EAF0F8; --ink2:#A9B6CB; --line:#2A3A57; --chip:#22314F;
    --full:#5CBF62; --half:#FF8A3D; --focus:#7FB2FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --ink:#EAF0F8; --ink2:#A9B6CB; --line:#2A3A57; --chip:#22314F;
  --full:#5CBF62; --half:#FF8A3D; --focus:#7FB2FF;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--focus)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer}
.pnum{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.pnum .big{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.5px}
.pnum .meta{min-width:0}
.pnum .focus{font-weight:700;font-size:17px;line-height:1.2}
.pnum .phase{font-size:13.5px;color:var(--ink2)}
.phasebar{height:5px;border-radius:3px;margin-top:8px}
main section{margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.obj{font-size:15.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--chip)}
.btn.go{background:var(--amber);color:var(--amber-ink);font-family:"Barlow Condensed",sans-serif;font-size:21px;letter-spacing:.3px;padding:10px 22px}
.btn.small{padding:8px 12px;font-size:14px}
.courthead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:18px 2px 8px}
.courthead .sw{width:12px;height:12px;border-radius:3px}
.blk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--full);border-radius:12px;padding:12px 12px 12px 12px;margin-bottom:8px}
.blk.half{border-left-color:var(--half)}
.blk.water{padding:8px 12px;color:var(--ink2)}
.blk .row1{display:flex;gap:10px;align-items:baseline}
.blk .time{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;min-width:84px;color:var(--ink2)}
.blk .bname{font-weight:700}
.blk .drill{font-size:15.5px;margin-top:4px;font-weight:600}
.blk .det{font-size:14.5px;color:var(--ink2);margin-top:2px}
.cue{margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1.15}
.cue::before{content:"Cue  ";font-family:Barlow,sans-serif;font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.2px}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14px;font-weight:600}
.cardchip{display:inline-block;border-radius:7px;padding:1px 7px;font-weight:700;font-size:13px;color:#fff;margin-left:6px;cursor:pointer;border:0;vertical-align:1px}
.diagram{width:100%;height:auto;border-radius:10px;display:block;background:#F6EBD9}
.feat h3,.panel h3{margin:0 0 6px;font-family:"Barlow Condensed",sans-serif;font-size:23px;line-height:1.1}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}
.ck input{width:20px;height:20px;margin-top:2px;flex:none}
.ftform{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.ftform label{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);font-weight:600}
.ftform input{width:88px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.muted{color:var(--ink2);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--amber)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.fchip .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clist{display:grid;gap:8px}
.citem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.citem .code{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;min-width:58px;padding:2px 8px;border-radius:8px;text-align:center}
.citem .t{font-weight:700;line-height:1.2}
.citem .s{font-size:13.5px;color:var(--ink2)}
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(5,10,20,.55)}
.sheet.open{display:block}
.sheet .box{position:absolute;left:0;right:0;bottom:0;top:6vh;max-width:760px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{padding:16px 16px 14px;color:#fff;position:sticky;top:0;display:flex;gap:12px;align-items:center}
.sheet .hd .code{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:34px;line-height:1}
.sheet .hd .tt{flex:1;min-width:0;font-weight:700;line-height:1.2}
.sheet .hd .tt small{display:block;font-weight:500;opacity:.9}
.sheet .hd button{background:rgba(255,255,255,.2);border:0;color:inherit;width:40px;height:40px;border-radius:10px;font-size:22px;cursor:pointer}
.sheet .bd{padding:14px 16px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--chip)}
.vid{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.vid input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px;margin:6px 0}
/* run mode */
.run{position:fixed;inset:0;z-index:30;display:none;background:#0B1324;color:#F4F6F9;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.run.open{display:flex}
.run .rtop{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:#A9B6CB}
.run .rtop button{background:#1C2942;border:0;color:#F4F6F9;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.run .court{margin-top:16px;font-weight:700;font-size:14px}
.run .bname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;color:#FFB81C;margin-top:4px}
.run .rdrill{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.run .clock{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:min(30vw,170px);line-height:1;letter-spacing:-2px;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.run .bar{height:8px;background:#1C2942;border-radius:4px;overflow:hidden}
.run .bar i{display:block;height:100%;background:#FFB81C;width:0}
.run .rdet{color:#C9D3E2;margin-top:12px;font-size:16px}
.run .rcue{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:10px}
.run .next{margin-top:auto;color:#A9B6CB;font-size:15px;padding-top:14px}
.run .ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;gap:10px;margin-top:12px}
.run .ctl button{border:0;border-radius:14px;padding:16px 6px;font-weight:800;font-size:17px;background:#1C2942;color:#F4F6F9;cursor:pointer}
.run .ctl .pp{background:#FFB81C;color:#3A2A00}
.chart{width:100%;height:auto;display:block}
table.log{width:100%;border-collapse:collapse;font-size:15px}
table.log td,table.log th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.sys h3{margin-top:4px}
.sys dl{margin:0}
.sys dt{font-weight:700;margin-top:8px}
.sys dd{margin:2px 0 0;color:var(--ink2);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sync{font-size:12.5px;color:var(--ink2);margin-top:6px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Flash card"><div class="box" id="sheetbox"></div></div>
<div class="run" id="run" role="dialog" aria-modal="true" aria-label="Practice timer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="practice" aria-selected="true">Practice</button>
  <button role="tab" data-tab="cards" aria-selected="false">Flash cards</button>
  <button role="tab" data-tab="ft" aria-selected="false">Free throws</button>
  <button role="tab" data-tab="system" aria-selected="false">System</button>
</div></nav>
<script>
const DATA = {"practices": [{"n": 1, "phase": 1, "pi": 1, "pt": 15, "stage": "TEACH", "focus": "Ball handling + 100 Part 1 install", "objective": "Learn the practice routine, the varsity vocabulary, and how to get to the 1-2-2 and match up. Record every player's free throw baseline.", "rows": [{"start": 0, "end": 10, "block": "Warm-up", "drill": "Dynamic warm-up", "det": "Coach-led: teach the 8-step routine (jog/backpedal, high knees, carioca, lunges, leg swings, slides, form layups, sprint-outs).", "card": "", "court": "full", "cue": "Talk the whole time; sprint the last one.", "video": "https://www.youtube.com/results?search_query=basketball+dynamic+warm+up+youth"}, {"start": 10, "end": 25, "block": "Fast break", "drill": "Outlet passing", "det": "Rebound, chin, pivot to the sideline, outlet to the ball-side wing.", "card": "FB-1", "court": "full", "cue": "Chin it, pivot, outlet.", "video": "https://www.youtube.com/results?search_query=basketball+rebound+outlet+pass+drill"}, {"start": 25, "end": 40, "block": "100 full-court D", "drill": "100 Part 1 walk-through", "det": "Name front row (3) and back row (2). Sprint to the closest 1-2-2 spot, point, and call the matchup. Walk, then jog.", "card": "PD-1", "court": "full", "cue": "Closest spot, point, talk.", "video": "https://www.youtube.com/results?search_query=1-2-2+full+court+man+to+man+press+matchup+drill"}, {"start": 40, "end": 42, "block": "Water", "drill": "", "det": "", "card": "", "court": "full", "cue": "", "video": ""}, {"start": 42, "end": 60, "block": "Full-court scrimmage", "drill": "4-on-4 full court, walking press", "det": "After every make, walk into the 1-2-2 and call matchups, then play.", "card": "", "court": "full", "cue": "Talk on every possession.", "video": "https://www.youtube.com/results?search_query=4+on+4+full+court+basketball+drill"}, {"start": 60, "end": 70, "block": "Skill stations", "drill": "Ball-handling stations", "det": "Two-ball dribbling, cone weaves, then dribble knockout inside the arc.", "card": "", "court": "half", "cue": "Eyes up, pound it.", "video": "https://www.youtube.com/results?search_query=two+ball+dribbling+drills+youth+basketball"}, {"start": 70, "end": 82, "block": "50 / team concept", "drill": "50 Ball: stance and octagon", "det": "Tape octagons. Stance, nose on inside hip, slide on the tape. No offense yet.", "card": "HD-1", "court": "half", "cue": "Don't open the door.", "video": "https://www.youtube.com/results?search_query=basketball+on+ball+defense+don%27t+allow+middle+drive+drill"}, {"start": 82, "end": 90, "block": "Free throw finisher", "drill": "Beat the Coach", "det": "Team shoots 10 in a row, one per player. Make = team point, miss = coach point. Team wins: coach does pushups. Coach wins: team runs one sprint.", "card": "", "court": "half", "cue": "Same routine, every time.", "video": "https://www.youtube.com/results?search_query=fun+free+throw+games+basketball+practice"}], "featured": {"key": "PD-1", "title": "Instant 1-2-2", "text": "Coach scores or tosses a rebound. Five defenders sprint to the closest 1-2-2 spot, point at their player, and call the matchup (\"I've got 12!\") within 3 seconds, while five offensive players jog to inbound spots. Rotate who plays front row and back row.", "cue": "Closest spot, point, talk.", "card": "PD-1"}, "checkpoint": [], "notes": "Before the finisher, each player shoots 10 free throws. Record the baseline."}, {"n": 2, "phase": 1, "pi": 2, "pt": 15, "stage": "TEACH", "focus": "Layups + matchups at half speed", "objective": "Build layup footwork with both hands and get the 1-2-2 matchups automatic at half speed.", "rows": [{"start": 0, "end": 10, "block": "Warm-up", "drill": "Dynamic warm-up", "det": "Coach-led: teach the 8-step routine (jog/backpedal, high knees, carioca, lunges, leg swings, slides, form layups, sprint-outs).", "card": "", "court": "full", "cue": "Talk the whole time; sprint the last one.", "video": "https://www.youtube.com/results?search_query=basketball+dynamic+warm+up+youth"}, {"start": 10, "end": 25, "block": "Fast break", "drill": "3-man lanes", "det": "Fill the wings wide; touch the cone at half court before cutting.", "card": "FB-2", "court": "full", "cue": "Wide wings, open middle.", "video": "https://www.youtube.com/results?search_query=basketball+3+man+lanes+fast+break+drill"}, {"start": 25, "end": 40, "block": "100 full-court D", "drill": "Instant 1-2-2 at half speed", "det": "Coach scores; defense sprints to the closest spot and calls matchups within 3 seconds. Rotate front and back row.", "card": "PD-1", "court": "full", "cue": "Closest spot, point, talk.", "video": "https://www.youtube.com/results?search_query=1-2-2+full+court+man+to+man+press+matchup+drill"}, {"start": 40, "end": 42, "block": "Water", "drill": "", "det": "", "card": "", "court": "full", "cue": "", "video": ""}, {"start": 42, "end": 60, "block": "Full-court scrimmage", "drill": "3-on-3 full court", "det": "Make it, take it. After a make, pick up in the 1-2-2 shape.", "card": "", "court": "full", "cue": "Talk on every possession.", "video": "https://www.youtube.com/results?search_query=3+on+3+full+court+basketball+drill"}, {"start": 60, "end": 70, "block": "Skill stations", "drill": "Layup stations", "det": "Mikan drill, right- and left-hand layups, power layups.", "card": "", "court": "half", "cue": "High hand, high knee.", "video": "https://www.youtube.com/results?search_query=mikan+drill+basketball+layups+youth"}, {"start": 70, "end": 82, "block": "50 / team concept", "drill": "50 Ball: closeouts", "det": "Lines from the paint to the wing: inside hand up, touch, jump back.", "card": "HD-2", "court": "half", "cue": "Touch, jump back, Dead means Black.", "video": "https://www.youtube.com/results?search_query=basketball+closeout+drill+youth"}, {"start": 82, "end": 90, "block": "Free throw finisher", "drill": "Pressure Ladder", "det": "Each player shoots 1. Every make extends the team streak; a miss resets it. Beat yesterday's record.", "card hase 4: Sharpen", "color": "#8D6E00", "first": 40, "last": 45}}, "ft": {"Beat the Coach": "Team shoots 10 in a row, one per player. Make = team point, miss = coach point. Team wins: coach does pushups. Coach wins: team runs one sprint.", "Pressure Ladder": "Each player shoots 1. Every make extends the team streak; a miss resets it. Beat yesterday's record.", "Around the World Line": "Pairs go head-to-head on a tape ladder. Make = step back one spot. First to the end wins.", "Free Throw Knockout": "Knockout, but only from the free throw line. Last one in wins.", "Lucky Number": "Coach secretly picks a team make total (say 7 of 12). Hit it exactly and practice ends with the players' choice of game.", "Distraction Shooting": "Teammates cheer, wave, and yell (no touching, no crossing the lane) while one player shoots.", "One-and-One Drama": "Coach sets a scenario: \"Down 1, 3 seconds left, one-and-one.\" Make both and the team skips next practice's warm-up sprints.", "Free Throw Championship": "Bracket tournament, best of 5 per round. Winner gets a trophy or picks the music next week."}, "featVideo": {"d100": "https://www.youtube.com/results?search_query=1-2-2+full+court+man+to+man+press", "d50": "https://www.youtube.com/results?search_query=basketball+shell+drill+man+to+man+defense", "dbreak": "https://www.youtube.com/results?search_query=basketball+numbered+fast+break+1+2+3+4+5+lanes", "elevenman": "https://www.youtube.com/results?search_query=basketball+11+man+break+drill", "cont321": "https://www.youtube.com/results?search_query=basketball+3+on+2+on+1+continuous+drill", "box_blob": "https://www.youtube.com/results?search_query=basketball+box+baseline+out+of+bounds+play", "ftgame": "https://www.youtube.com/results?search_query=fun+free+throw+games+basketball+practice"}};
const P = DATA.practices, C = DATA.cards, CARD = Object.fromEntries(C.map(c => [c.code, c]));
const CATS = [["red","Red","100 defense"],["white","White","50 defense"],["orange","Orange","Transition D"],["green","Green","Fast break"],["blue","Blue","Finishing"],["purple","Purple","Ball handling"],["yellow","Yellow","Shooting"],["brown","Brown","Rebounding"]];
const CATCOLOR = Object.fromEntries(C.map(c => [c.cat, c.color]));
const S = { tab: "practice", n: 1, ft: {}, videos: {}, done: {}, cat: "all", court: "all", db: null, local: false };

// ---------- storage: shared db when available, otherwise this device ----------
function lsGet(k, d) { try { const v = localStorage.getItem("bb7:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem("bb7:" + k, JSON.stringify(v)); } catch (e) {} }
function loadLocal() { S.ft = lsGet("ft", {}); S.videos = lsGet("videos", {}); S.done = lsGet("done", {}); const n = lsGet("n", null); if (n) S.n = n; }
loadLocal();
async function connectDb() {
  let db = null;
  if (!db) { S.local = true; render(); return; }
  S.db = db;
  db.collection("ft").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { const v = d.data(); if (v) o[d.id] = v; }); S.ft = o; lsSet("ft", o); if (S.tab !== "practice" || !document.activeElement || document.activeElement.tagName !== "INPUT") render(); }, () => {});
  db.collection("videos").onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.url) o[d.id] = v.url; }); S.videos = o; lsSet("videos", o); }, () => {});
  db.doc("state/team").onSnapshot(d => { const v = d.exists ? d.data() : null; if (v && v.done) { S.done = Object.assign({}, v.done); lsSet("done", S.done); if (S.tab === "practice") render(); } }, () => {});
  render();
}
async function saveFt(n, made, att) {
  const k = "p" + n; S.ft[k] = { n, made, att }; lsSet("ft", S.ft);
  if (S.db) { try { await S.db.doc("ft/" + k).set({ n, made, att }); } catch (e) { toast("Saved on this device only"); return; } }
  toast("Free throws saved for Practice " + n);
}
async function saveVideo(code, url) {
  if (url) S.videos[code] = url; else delete S.videos[code]; lsSet("videos", S.videos);
  if (S.db) { try { if (url) await S.db.doc("videos/" + code).set({ url }); else await S.db.doc("videos/" + code).delete(); } catch (e) { toast("Saved on this device only"); return; } }
  toast(url ? "Video link saved" : "Video link removed");
}
async function toggleDone(n) {
  S.done[n] = !S.done[n]; if (!S.done[n]) delete S.done[n]; lsSet("done", S.done);
  if (S.db) { try { await S.db.doc("state/team").set({ done: S.done }); } catch (e) {} }
  render();
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1800); }

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = m => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const chip = code => { const c = CARD[code]; if (!c) return ""; const fg = (c.cat === "white" || c.cat === "yellow") ? "#12233F" : "#fff"; const bd = c.cat === "white" ? "border:1px solid #9AA3B0;" : ""; return `<button class="cardchip" style="background:${c.color};color:${fg};${bd}" data-card="${code}" aria-label="Open card ${code}">${code}</button>`; };
const videoFor = (code, fallback) => code && S.videos[code] ? { url: S.videos[code], label: "Watch saved video" } : (fallback ? { url: fallback, label: "Find demo videos" } : null);
const phase = p => DATA.phases[p.phase];

// ---------- views ----------
function viewPractice() {
  const p = P[S.n - 1], ph = phase(p);
  let rows = "", last = null;
  p.rows.forEach(r => {
    if (r.court !== last) { rows += `<div class="courthead"><span class="sw" style="background:var(--${r.court})"></span>${r.court === "full" ? "Full court: first 60 minutes" : "Half court only: last 30 minutes"}</div>`; last = r.court; }
    if (r.block === "Water") { rows += `<div class="blk water ${r.court}"><span class="time cond">${fmt(r.start)}–${fmt(r.end)}</span> Water</div>`; return; }
    const v = videoFor(r.card, r.video);
    rows += `<div class="blk ${r.court}"><div class="row1"><span class="time">${fmt(r.start)}–${fmt(r.end)}</span><span class="bname">${esc(r.block)}</span></div>
      <div class="drill">${esc(r.drill)}${r.card ? chip(r.card) : ""}</div>
      <div class="det">${esc(r.det)}</div>
      ${r.cue ? `<div class="cue">${esc(r.cue)}</div>` : ""}
      ${v ? `<div class="links"><a href="${esc(v.url)}" target="_blank" rel="noopener">${v.label}</a></div>` : ""}</div>`;
  });
  const f = p.featured, img = f.card ? CARD[f.card].svg : DATA.diagrams[f.key];
  const fv = videoFor(f.card, f.card ? CARD[f.card].video : DATA.featVideo[f.key]);
  const ft = S.ft["p" + p.n] || {};
  const ck = p.checkpoint.length ? `<section class="panel ck"><h3>Checkpoint</h3>${p.checkpoint.map((c, i) => `<label><input type="checkbox">${esc(c)}</label>`).join("")}</section>` : "";
  const note = p.notes ? `<p class="obj"><strong>Coach note:</strong> ${esc(p.notes)}</p>` : "";
  return `<header class="top"><div class="stepper">
      <button id="prev" aria-label="Previous practice">‹</button>
      <div class="pnum"><span class="big">${p.n}</span><div class="meta"><div class="focus">${esc(p.focus)}</div><div class="phase">${esc(ph.name)}, practice ${p.pi} of ${p.pt}${S.done[p.n] ? ", done" : ""}</div></div></div>
      <button id="next" aria-label="Next practice">›</button></div>
      <div class="phasebar" style="background:${ph.color}"></div></header>
    <main>
      <section class="panel"><div class="obj">${esc(p.objective)}</div>${note}
        <div class="btnrow"><button class="btn go" id="start">Start practice timer</button><button class="btn" id="done">${S.done[p.n] ? "Marked done" : "Mark done"}</button><label class="muted" style="display:block;width:100%">Go to practice<select id="jump" style="display:block;width:100%;max-width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)">${P.map(q => `<option value="${q.n}" ${q.n === p.n ? "selected" : ""}>${q.n}. ${esc(q.focus)}</option>`).join("")}</select></label></div></section>
      ${rows}
      <section class="panel feat"><h3>Featured drill: ${esc(f.title)}${f.card ? chip(f.card) : ""}</h3>
        <img class="diagram" alt="Court diagram for ${esc(f.title)}" src="${img}">
        <p>${esc(f.text)}</p><div class="cue">${esc(f.cue)}</div>
        ${fv ? `<div class="links"><a href="${esc(fv.url)}" target="_blank" rel="noopener">${fv.label}</a></div>` : ""}</section>
      ${ck}
      <section class="panel"><h3>Free throw finisher</h3><div class="ftform">
        <label>Made<input id="ftm" type="number" inputmode="numeric" min="0" value="${ft.made ?? ""}"></label>
        <label>Attempted<input id="fta" type="number" inputmode="numeric" min="0" value="${ft.att ?? ""}"></label>
        <button class="btn" id="ftsave">Save free throws</button></div>
        <div class="sync">Saved on this phone.</div></section>
    </main>`;
}

function viewCards() {
  const list = C.filter(c => (S.cat === "all" || c.cat === S.cat) && (S.court === "all" || c.court.toLowerCase().startsWith(S.court)));
  const f = `<div class="filters" role="group" aria-label="Filter by color">
    <button class="fchip" data-cat="all" aria-pressed="${S.cat === "all"}">All</button>
    ${CATS.map(([k, n, d]) => `<button class="fchip" data-cat="${k}" aria-pressed="${S.cat === k}"><span class="dot" style="background:${CATCOLOR[k]}"></span>${n}<span class="muted" style="font-weight:500">${d}</span></button>`).join("")}</div>
    <div class="filters" role="group" aria-label="Filter by court">
    ${[["all", "Any court"], ["full", "Full court"], ["half", "Half court"]].map(([k, n]) => `<button class="fchip" data-court="${k}" aria-pressed="${S.court === k}">${n}</button>`).join("")}</div>`;
  const items = list.map(c => { const fg = (c.cat === "white" || c.cat === "yellow") ? "#12233F" : "#fff"; return `<button class="citem" data-card="${c.code}"><span class="code" style="background:${c.color};color:${fg};${c.cat === "white" ? "border:1px solid #9AA3B0" : ""}">${c.code}</span><span><span class="t">${esc(c.title)}</span><br><span class="s">${esc(c.drill)}, ${c.court.toLowerCase()}</span></span></button>`; }).join("");
  return `<header class="top"><div class="pnum"><span class="big" style="font-size:40px">Flash cards</span></div><div class="muted">Spot the problem, pick the color, run the card for 5–8 minutes.</div></header>
    <main><section>${f}<div class="clist">${items || `<p class="muted">No cards match. Try "All" or "Any court".</p>`}</div></section></main>`;
}

function viewFt() {
  const logs = Object.values(S.ft).filter(x => x && x.att > 0).sort((a, b) => a.n - b.n);
  const base = S.ft.p1 && S.ft.p1.att ? S.ft.p1.made / S.ft.p1.att : null;
  const tm = logs.reduce((s, x) => s + x.made, 0), ta = logs.reduce((s, x) => s + x.att, 0);
  let chart = `<p class="muted">Log the free throw finisher on any practice page. Practice 1 is the team baseline.</p>`;
  if (logs.length) {
    const W = 640, H = 300, L = 62, R = 14, T = 20, B = 40;
    const x = n => L + (n - 1) / 44 * (W - L - R), y = v => T + (1 - v) * (H - T - B);
    let g = "";
    [0, .25, .5, .75, 1].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" font-size="20" text-anchor="end" fill="var(--ink2)">${v * 100}%</text>`; });
    [1, 15, 30, 39, 45].forEach(n => { g += `<text x="${x(n)}" y="${H - 10}" font-size="20" text-anchor="middle" fill="var(--ink2)">${n}</text>`; });
    if (base !== null) g += `<line x1="${L}" x2="${W - R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--half)" stroke-dasharray="5 4"/><text x="${W - R}" y="${y(base) - 6}" font-size="20" text-anchor="end" fill="var(--half)">Baseline ${Math.round(base * 100)}%</text>`;
    const pts = logs.map(l => `${x(l.n)},${y(l.made / l.att)}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="var(--focus)" stroke-width="4"/>`;
    logs.forEach(l => { g += `<circle cx="${x(l.n)}" cy="${y(l.made / l.att)}" r="7" fill="var(--focus)"><title>Practice ${l.n}: ${l.made}/${l.att}</title></circle>`; });
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Team free throw percentage by practice">${g}</svg>`;
  }
  const rows = logs.slice().reverse().map(l => `<tr><td>Practice ${l.n}</td><td>${l.made} / ${l.att}</td><td>${Math.round(l.made / l.att * 100)}%</td></tr>`).join("");
  return `<header class="top"><div class="pnum"><span class="big" style="font-size:40px">Free throws</span></div>
      <div class="muted">${ta ? `Season: ${tm} of ${ta} (${Math.round(tm / ta * 100)}%)${base !== null ? `. Baseline: ${Math.round(base * 100)}%.` : "."}` : "No free throws logged yet."}</div></header>
    <main><section class="panel">${chart}</section>
    ${rows ? `<section class="panel"><table class="log"><thead><tr><th>Practice</th><th>Made</th><th>Pct</th></tr></thead><tbody>${rows}</tbody></table></section>` : ""}
    <section class="panel"><h3>Finisher games</h3><dl class="sys">${Object.entries(DATA.ft).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section></main>`;
}

function viewSystem() {
  return `<header class="top"><div class="pnum"><span class="big" style="font-size:40px">The system</span></div><div class="muted">Varsity language. Teach these words from Practice 1.</div></header>
  <main class="sys">
  <section class="panel"><h3>The 100: full-court press out of a 1-2-2</h3><img class="diagram" alt="The 100 alignment" src="${DATA.diagrams.d100}">
  <dl><dt>1. Get to spots and match up</dt><dd>Sprint to the closest 1-2-2 spot. Front row (3) plays inside and behind; back row (2) plays the inside hip, no long passes. Inbound defender steers the pass to the short side. Point and call your matchup.</dd>
  <dt>2. Guard the ball</dt><dd>Arrive as the pass arrives. Heat with wide arms. Nose on the inside hip; run them up the sideline.</dd>
  <dt>3. Off-ball jobs</dt><dd>Man-you-ball, rotate to the rimline. Inbound defender denies the short middle; backside front row the medium middle; back row the deep middle and the sideline. Back row never traps.</dd>
  <dt>4. Behind the ball (the key)</dt><dd>Never stay behind the ball. Sprint to punch it out or get above it. Players above the ball slow it and protect the hoop.</dd>
  <dt>5. Blue traps (bonus)</dt><dd>Trap a sideline speed dribble or a turned back, from the backside only. Angles, don't get split, 100% or 0%. Call the name.</dd></dl>
  <div class="cue">Matched up and above the ball.</div></section>
  <section class="panel"><h3>The 50: half-court man-to-man</h3><img class="diagram" alt="The 50 shell" src="${DATA.diagrams.d50}">
  <dl><dt>Ball</dt><dd>No middle drives; shoot over a hand. Closeout: inside hand up, touch, jump back. Octagon footwork, don't open the door. Pick-up = "Dead!" and everyone goes Black (deny).</dd>
  <dt>Gap</dt><dd>One pass away: one step off the line, man-you-ball, wide arms. Stunt and stay; no rhythm catch-and-shoot 3s.</dd>
  <dt>Goalie</dt><dd>Lowest backside defender on the rimline. Help early, wall up, never try to block. We always have a Goalie.</dd>
  <dt>Drop</dt><dd>When the Goalie leaves, protect the backside block. A skip pass triggers the scramble.</dd></dl>
  <div class="cue">Ball, Gap, Goalie, Drop.</div></section>
  <section class="panel"><h3>Numbered fast break</h3><img class="diagram" alt="Numbered break" src="${DATA.diagrams.dbreak}">
  <dl><dt>1 Point guard</dt><dd>Outlet on the ball side, push the middle.</dd><dt>2 and 3 Wings</dt><dd>Sprint wide to the corners.</dd><dt>4 Trailer</dt><dd>Top of the key for the reversal.</dd><dt>5 Rim runner</dt><dd>Rim to rim, post up ball side.</dd></dl>
  <div class="cue">Rebound and run.</div></section>
  <section class="panel"><h3>Vocabulary</h3><dl>
  ${[["Heat", "Ball pressure with wide arms"], ["Man-you-ball", "Off-ball triangle between your player and the ball"], ["Rimline", "Line through the rim, side to side"], ["Above the ball", "Between the ball and our basket"], ["Punch-out", "Poke the ball loose from behind"], ["Octagon", "Floor tape for on-ball footwork"], ["Dead", "Call when the dribble is picked up"], ["Black", "Deny every pass after Dead"], ["Blue", "Traps in the 100 (bonus)"]].map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}
  </dl></section></main>`;
}

function render() {
  const app = document.getElementById("app");
  const html = S.tab === "practice" ? viewPractice() : S.tab === "cards" ? viewCards() : S.tab === "ft" ? viewFt() : viewSystem();
  app.innerHTML = `<div class="wrap">${html}</div>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  bind();
}

function bind() {
  const $ = id => document.getElementById(id);
  if ($("prev")) $("prev").onclick = () => { S.n = Math.max(1, S.n - 1); lsSet("n", S.n); render(); window.scrollTo(0, 0); };
  if ($("next")) $("next").onclick = () => { S.n = Math.min(45, S.n + 1); lsSet("n", S.n); render(); window.scrollTo(0, 0); };
  if ($("done")) $("done").onclick = () => toggleDone(S.n);
  if ($("jump")) $("jump").onchange = e => { const n = parseInt(e.target.value, 10); if (n >= 1 && n <= 45) { S.n = n; lsSet("n", n); render(); window.scrollTo(0, 0); } };
  if ($("start")) $("start").onclick = () => runStart(P[S.n - 1]);
  if ($("ftsave")) $("ftsave").onclick = () => { const m = parseInt($("ftm").value, 10), a = parseInt($("fta").value, 10); if (!(a > 0) || !(m >= 0) || m > a) { toast("Enter made and attempted (made can't be more than attempted)"); return; } saveFt(S.n, m, a); };
  document.querySelectorAll("[data-card]").forEach(b => b.onclick = e => { e.stopPropagation(); openCard(b.dataset.card); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.cat = b.dataset.cat; render(); });
  document.querySelectorAll("[data-court]").forEach(b => b.onclick = () => { S.court = b.dataset.court; render(); });
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

// ---------- card sheet ----------
function openCard(code) {
  const c = CARD[code], fg = (c.cat === "white" || c.cat === "yellow") ? "#12233F" : "#fff", cur = S.videos[code] || "";
  document.getElementById("sheetbox").innerHTML = `<div class="hd" style="background:${c.color};color:${fg}"><span class="code">${c.code}</span><span class="tt">${esc(c.title)}<small>${c.cname}: ${esc(c.area)}${c.ref ? ", " + esc(c.ref) : ""}</small></span><button id="sclose" aria-label="Close card">×</button></div>
    <div class="bd"><span class="tag">${c.court}</span>
    <h3 style="font-family:'Barlow Condensed',sans-serif;font-size:24px;margin:12px 0 8px">Drill: ${esc(c.drill)}</h3>
    <img class="diagram" alt="Court diagram for ${esc(c.drill)}" src="${c.svg}">
    <p>${esc(c.text)}</p><div class="cue">${esc(c.cue)}</div>
    <div class="vid"><div class="links">${cur ? `<a href="${esc(cur)}" target="_blank" rel="noopener">Watch saved video</a>` : ""}<a href="${esc(c.video)}" target="_blank" rel="noopener">Find demo videos</a></div>
    <label class="muted" for="vurl" style="display:block;margin-top:10px">Your video link (for example, the varsity's own clip). Saved on this phone.</label>
    <input id="vurl" type="url" placeholder="Paste a YouTube or Hudl link" value="${esc(cur)}">
    <div class="btnrow"><button class="btn small" id="vsave">Save video link</button>${cur ? `<button class="btn small" id="vclear">Remove</button>` : ""}</div></div></div>`;
  const sh = document.getElementById("sheet"); sh.classList.add("open");
  document.getElementById("sclose").focus();
  document.getElementById("sclose").onclick = closeCard;
  document.getElementById("vsave").onclick = async () => { const u = document.getElementById("vurl").value.trim(); if (u && !/^https?:\/\//i.test(u)) { toast("Links must start with http:// or https://"); return; } await saveVideo(code, u); openCard(code); };
  if (document.getElementById("vclear")) document.getElementById("vclear").onclick = async () => { await saveVideo(code, ""); openCard(code); };
}
function closeCard() { document.getElementById("sheet").classList.remove("open"); }
document.getElementById("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeCard(); } });

// ---------- run mode (practice timer) ----------
const R = { p: null, i: 0, left: 0, paused: false, t: null, lock: null, actx: null, endAt: 0 };
function setBlock(i) { R.i = i; R.left = (R.p.rows[i].end - R.p.rows[i].start) * 60; R.endAt = Date.now() + R.left * 1000; }
function blocksOf(p) { return p.rows; }
function beep() { try { R.actx = R.actx || new (window.AudioContext || window.webkitAudioContext)(); const o = R.actx.createOscillator(), g = R.actx.createGain(); o.frequency.value = 880; g.gain.value = .25; o.connect(g); g.connect(R.actx.destination); o.start(); setTimeout(() => { o.stop(); }, 450); } catch (e) {} if (navigator.vibrate) navigator.vibrate([250, 120, 250]); }
async function runStart(p) {
  R.p = p; R.paused = false; setBlock(0);
  document.getElementById("run").classList.add("open");
  try { if (navigator.wakeLock) R.lock = await navigator.wakeLock.request("screen"); } catch (e) {}
  try { R.actx = R.actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  clearInterval(R.t); R.t = setInterval(tick, 1000); runRender();
}
function tick() { if (R.paused) return; R.left = Math.max(0, Math.ceil((R.endAt - Date.now()) / 1000)); if (R.left <= 0) { beep(); if (R.i < R.p.rows.length - 1) { setBlock(R.i + 1); } else { R.left = 0; R.paused = true; } } runRender(); }
function runStop() { clearInterval(R.t); document.getElementById("run").classList.remove("open"); try { R.lock && R.lock.release(); } catch (e) {} R.lock = null; }
function runRender() {
  const p = R.p, r = p.rows[R.i], nx = p.rows[R.i + 1], dur = (r.end - r.start) * 60;
  const elapsed = r.start * 60 + (dur - R.left), finished = R.i === p.rows.length - 1 && R.left === 0;
  const el = document.getElementById("run");
  el.innerHTML = `<div class="rtop"><span>Practice ${p.n}, ${mmss(elapsed)} of 90:00</span><button id="rclose">Close</button></div>
    <div class="court" style="color:${r.court === "full" ? "#7BD17F" : "#FF9E5E"}">${r.court === "full" ? "Full court" : "Half court only"}</div>
    <div class="bname">${esc(r.block)}</div><div class="rdrill">${esc(r.drill || "Water")}${r.card ? " (" + r.card + ")" : ""}</div>
    <div class="clock" aria-live="off">${finished ? "Done" : mmss(R.left)}</div>
    <div class="bar"><i style="width:${(1 - R.left / dur) * 100}%"></i></div>
    ${r.det ? `<div class="rdet">${esc(r.det)}</div>` : ""}${r.cue ? `<div class="rcue">${esc(r.cue)}</div>` : ""}
    <div class="next">${nx ? `Next at ${fmt(nx.start)}: ${esc(nx.block)}, ${esc(nx.drill || "")}${nx.court !== r.court ? (nx.court === "half" ? " (move to half court)" : "") : ""}` : finished ? "Practice complete. Log your free throws." : "Last block"}</div>
    <div class="ctl"><button id="rprev" aria-label="Previous block">Back</button><button class="pp" id="rpp">${R.paused ? "Resume" : "Pause"}</button><button id="radd" aria-label="Add one minute">+1 min</button><button id="rnext" aria-label="Next block">Next</button></div>`;
  document.getElementById("rclose").onclick = runStop;
  document.getElementById("rpp").onclick = () => { R.paused = !R.paused; if (!R.paused) R.endAt = Date.now() + R.left * 1000; runRender(); };
  document.getElementById("radd").onclick = () => { R.left += 60; R.endAt += 60000; runRender(); };
  document.getElementById("rnext").onclick = () => { if (R.i < p.rows.length - 1) { setBlock(R.i + 1); if (R.paused) R.endAt = 0; runRender(); } };
  document.getElementById("rprev").onclick = () => { if (R.i > 0) { setBlock(R.i - 1); runRender(); } };
}
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && R.p && document.getElementById("run").classList.contains("open")) { try { if (navigator.wakeLock) R.lock = await navigator.wakeLock.request("screen"); } catch (e) {} } });

render();
connectDb();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
</html>
